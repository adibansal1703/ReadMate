name: readmate
description: A mobile books tracker written in Flutter. Free, private.

publish_to: "none"

version: 2.11.0+59

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  path_provider: ^2.0.11
  rxdart: ^0.28.0
  path: ^1.9.0
  flutter_bloc: ^9.0.0
  fl_chart: ^0.70.2
  dropdown_button2: ^2.0.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.1
  http: ^1.2.0
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.2.0+3
  infinite_scroll_pagination: ^5.1.1
  flutter_staggered_grid_view: ^0.7.0
  settings_ui: ^2.0.2
  url_launcher: ^6.1.6
  font_awesome_flutter: ^11.0.0
  hydrated_bloc: ^10.0.0
  device_info_plus: ^11.2.2
  dynamic_color: ^1.6.2
  image_fade: ^0.6.2
  package_info_plus: ^8.0.0
  animated_widgets: ^1.1.0
  easy_localization: ^3.0.7
  flutter_typeahead: ^5.0.1
  flex_color_picker: ^3.2.2
  diacritic: ^0.1.4
  flutter_speed_dial: ^7.0.0
  smooth_page_indicator: ^1.1.0
  intl: ^0.20.2
  dotted_border: ^3.1.0
  flutter_cache_manager: ^3.3.1
  modal_bottom_sheet: ^3.0.0
  confetti: ^0.7.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  flutter_native_splash: ^2.4.1
  
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "./assets/icons/icon.png"
  adaptive_icon_foreground: "./assets/icons/icon.png"
  adaptive_icon_background: "#00BFA6"
  min_sdk_android: 21
  android: "launcher_icon"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/icon.png
  android_12:
    color: "#ffffff"
    image: assets/icons/icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/translations/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
